version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: HrmsPg@2026!8KxP
      POSTGRES_DB: hrms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - HrmsRedis@2026!9Lm
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "HrmsRedis@2026!9Lm", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrmsadmin
      MINIO_ROOT_PASSWORD: HrmsMinio@2026!4Qz
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hrms:HrmsPg@2026!8KxP@postgres:5432/hrms
      DATABASE_URL_SYNC: postgresql+psycopg://hrms:HrmsPg@2026!8KxP@postgres:5432/hrms

      REDIS_URL: redis://:HrmsRedis@2026!9Lm@redis:6379/0
      CELERY_BROKER_URL: redis://:HrmsRedis@2026!9Lm@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:HrmsRedis@2026!9Lm@redis:6379/2

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: hrmsadmin
      S3_SECRET_KEY: HrmsMinio@2026!4Qz

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

    volumes:
      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hrms:HrmsPg@2026!8KxP@postgres:5432/hrms
      DATABASE_URL_SYNC: postgresql+psycopg://hrms:HrmsPg@2026!8KxP@postgres:5432/hrms

      REDIS_URL: redis://:HrmsRedis@2026!9Lm@redis:6379/0
      CELERY_BROKER_URL: redis://:HrmsRedis@2026!9Lm@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:HrmsRedis@2026!9Lm@redis:6379/2

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: hrmsadmin
      S3_SECRET_KEY: HrmsMinio@2026!4Qz

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

    volumes:
      - ./backend:/app

    command: celery -A app.core.celery_app worker --loglevel=info

